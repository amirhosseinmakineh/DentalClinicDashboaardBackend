name: Backend build

on:
  push:
    branches: [codex-lflotm]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-private-framework
        id: framework
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: dotnet restore DentalDashboard.slnx --configfile "${{ steps.framework.outputs.config-file }}"
      - run: dotnet build DentalDashboard.slnx --configuration Release --no-restore
