name: Backend build

on:
  push:
    branches: [codex-lflotm]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build DentalDashboard.slnx --configuration Release
