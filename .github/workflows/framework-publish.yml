name: Publish Framework to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'NuGet package version (for example 1.0.1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish versioned Framework package
    runs-on: ubuntu-latest
    if: github.event.repository.private == true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate package version
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        shell: bash
        run: |
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo 'Invalid NuGet package version'
            exit 1
          }
      - name: Restore Framework
        run: dotnet restore DentalDashboard.Framwork/DentalDashboard.Framwork.csproj
      - name: Build Framework
        run: dotnet build DentalDashboard.Framwork/DentalDashboard.Framwork.csproj --configuration Release --no-restore
      - name: Pack Framework
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          dotnet pack DentalDashboard.Framwork/DentalDashboard.Framwork.csproj \
            --configuration Release \
            --no-build \
            -p:PackageVersion="$PACKAGE_VERSION" \
            --output ./artifacts/framework
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push ./artifacts/framework/*.nupkg \
            --source "https://nuget.pkg.github.com/amirhosseinmakineh/index.json" \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate
