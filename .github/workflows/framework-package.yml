name: Framework package validation

on:
  push:
    branches:
      - feature/framework-private-from-code-lftom
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-framework-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore DentalDashboard.slnx
      - name: Build solution
        run: dotnet build DentalDashboard.slnx --configuration Release --no-restore
      - name: Pack Framework
        run: dotnet pack DentalDashboard.Framwork/DentalDashboard.Framwork.csproj --configuration Release --no-build --output ./artifacts/framework
      - name: Verify NuGet package content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import zipfile

          packages = glob.glob('artifacts/framework/*.nupkg')
          if len(packages) != 1:
              raise SystemExit(f'Expected one NuGet package, found {len(packages)}')

          with zipfile.ZipFile(packages[0]) as archive:
              names = archive.namelist()
              assemblies = [name for name in names if name.endswith('/DentalDashboard.Framwork.dll')]
              if not assemblies:
                  raise SystemExit('Framework DLL missing from NuGet package')
              forbidden = [name for name in names if name.lower().endswith(('.cs', '.pdb', '.snupkg'))]
              if forbidden:
                  raise SystemExit(f'Unexpected source or symbols: {forbidden}')
              print('Package verified:', packages[0])
          PY
      - name: Test backend build without Framework source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dental-package-consumer
          tar --exclude=.git --exclude=artifacts -cf - . | tar -xf - -C /tmp/dental-package-consumer
          cd /tmp/dental-package-consumer

          rm -rf DentalDashboard.Framwork
          dotnet restore DentalDashboard/DentalDashboard.csproj \
            --property:UsePrivateFrameworkPackage=true \
            --source "$GITHUB_WORKSPACE/artifacts/framework" \
            --source https://api.nuget.org/v3/index.json
          dotnet build DentalDashboard/DentalDashboard.csproj \
            --configuration Release \
            --no-restore \
            --property:UsePrivateFrameworkPackage=true
      - name: Test package-only Docker image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dental-package-docker
          tar --exclude=.git --exclude=artifacts -cf - . | tar -xf - -C /tmp/dental-package-docker
          mkdir -p /tmp/dental-package-docker/artifacts/framework
          cp artifacts/framework/*.nupkg /tmp/dental-package-docker/artifacts/framework/
          rm -rf /tmp/dental-package-docker/DentalDashboard.Framwork
          docker build \
            --file /tmp/dental-package-docker/Dockerfile.package \
            --tag dental-back:package-test \
            /tmp/dental-package-docker
      - name: Test private-feed Dockerfile with BuildKit secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dental-private-docker/artifacts/framework
          tar --exclude=.git --exclude=artifacts -cf - . | tar -xf - -C /tmp/dental-private-docker
          cp artifacts/framework/*.nupkg /tmp/dental-private-docker/artifacts/framework/
          rm -rf /tmp/dental-private-docker/DentalDashboard.Framwork
          sed -i '/^FROM mcr.microsoft.com\/dotnet\/sdk:10.0 AS build$/a COPY artifacts/framework/ /local-feed/' /tmp/dental-private-docker/Dockerfile.private
          cat > /tmp/dental-private-nuget.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="/local-feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          DOCKER_BUILDKIT=1 docker build \
            --secret id=nuget_config,src=/tmp/dental-private-nuget.config \
            --file /tmp/dental-private-docker/Dockerfile.private \
            --tag dental-back:private-test \
            /tmp/dental-private-docker
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: framework-nupkg
          path: artifacts/framework/*.nupkg
          if-no-files-found: error
          retention-days: 7
