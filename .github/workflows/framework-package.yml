name: Framework package validation

on:
  push:
    branches:
      - feature/private-framework-package
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore DentalDashboard.slnx
      - name: Build solution
        run: dotnet build DentalDashboard.slnx --configuration Release --no-restore
      - name: Pack Framework
        run: dotnet pack DentalDashboard.Framwork/DentalDashboard.Framwork.csproj --configuration Release --no-build --output ./artifacts/framework
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: framework-nupkg
          path: artifacts/framework/*.nupkg
          if-no-files-found: error
          retention-days: 7
