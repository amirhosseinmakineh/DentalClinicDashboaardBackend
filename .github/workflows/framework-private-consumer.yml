name: Framework private package consumer

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: DentalDashboard.Framework package version
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify-private-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate package version
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - name: Create temporary authenticated NuGet configuration
        env:
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/NuGet.Private.Config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="github-private" value="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <github-private>
                <add key="Username" value="${{ github.actor }}" />
                <add key="ClearTextPassword" value="$NUGET_TOKEN" />
              </github-private>
            </packageSourceCredentials>
          </configuration>
          EOF
      - name: Restore and publish without Framework source
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-consumer"
          tar --exclude=.git --exclude=artifacts -cf - . | tar -xf - -C "$RUNNER_TEMP/private-consumer"
          rm -rf "$RUNNER_TEMP/private-consumer/DentalDashboard.Framwork"
          dotnet restore "$RUNNER_TEMP/private-consumer/DentalDashboard/DentalDashboard.csproj" \
            -p:UsePrivateFrameworkPackage=true \
            -p:FrameworkPackageVersion="$PACKAGE_VERSION" \
            --configfile "$RUNNER_TEMP/NuGet.Private.Config"
          dotnet publish "$RUNNER_TEMP/private-consumer/DentalDashboard/DentalDashboard.csproj" \
            --configuration Release \
            --output "$RUNNER_TEMP/private-publish" \
            --no-restore \
            -p:UsePrivateFrameworkPackage=true \
            -p:FrameworkPackageVersion="$PACKAGE_VERSION" \
            /p:UseAppHost=false
          test -f "$RUNNER_TEMP/private-publish/DentalDashboard.Framwork.dll"
          if find "$RUNNER_TEMP/private-publish" -type f -name '*.cs' | grep -q .; then
            echo 'Unexpected C# source in publish output'
            exit 1
          fi
      - name: Build private-feed Docker image with BuildKit secret
        env:
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-docker"
          tar --exclude=.git --exclude=artifacts -cf - . | tar -xf - -C "$RUNNER_TEMP/private-docker"
          rm -rf "$RUNNER_TEMP/private-docker/DentalDashboard.Framwork"
          DOCKER_BUILDKIT=1 docker build \
            --secret id=nuget_config,src="$RUNNER_TEMP/NuGet.Private.Config" \
            --file "$RUNNER_TEMP/private-docker/Dockerfile.private" \
            --tag dental-back:private-package-test \
            "$RUNNER_TEMP/private-docker"
