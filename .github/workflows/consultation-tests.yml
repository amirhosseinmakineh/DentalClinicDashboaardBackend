name: Consultation SQL integration tests
on:
  pull_request:
    paths:
      - 'DentalDashboard.Consultation.Tests/**'
      - '**/*Lead*.cs'
      - '**/*Consultation*.cs'
      - '.github/workflows/consultation-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Consultation_CI_Only_4829!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Consultation_CI_Only_4829!' -C -Q 'SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      # Disposable service-container credentials; never a production connection.
      CONSULTATION_TEST_SQL: 'Server=localhost,1433;User Id=sa;Password=Consultation_CI_Only_4829!;TrustServerCertificate=true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/checkout@v4
        with:
          repository: amirhosseinmakineh/drsaeedMoghadamFront
          ref: 005554246168825055c1897de3616a63c548546a
          path: .consultation-frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .consultation-frontend/package-lock.json
      - name: Compile the actual frontend
        working-directory: .consultation-frontend
        run: |
          npm ci
          npm run check:source
          npm run typecheck
          CLINIC_BACKEND_SOURCE=.. npm run test:consultant
          npx ng build demo --configuration development
      - name: Install test-only browser
        run: |
          npm install --prefix "$RUNNER_TEMP/clinic-browser" playwright@1.56.1
          "$RUNNER_TEMP/clinic-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test real HTTP, SQL, shared allocation and consultant UI
        env:
          CONSULTATION_FRONTEND_DIST: ${{ github.workspace }}/.consultation-frontend/dist/demo/browser
          CONSULTATION_BROWSER_SCRIPT: ${{ github.workspace }}/.consultation-frontend/scripts/test-consultation.mjs
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/clinic-browser/node_modules/playwright
        run: dotnet test DentalDashboard.Consultation.Tests --configuration Release --logger 'console;verbosity=normal' --logger 'trx;LogFileName=consultation.trx'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consultation-test-results
          path: DentalDashboard.Consultation.Tests/TestResults/*.trx
