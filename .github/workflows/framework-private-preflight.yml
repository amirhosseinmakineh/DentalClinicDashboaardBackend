name: Framework private migration preflight

on:
  push:
    branches:
      - feature/framework-private-from-code-lftom
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check private migration prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile.private
          test -f deploy/NuGet.Private.Config.example
          test -f docs/private-nuget-deployment.md
          test -f .github/workflows/framework-publish.yml

          if [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "::notice::This repository is public. Framework source migration to a separate private repository remains required."
          fi

          if grep -nE '(^|[[:space:]])(ARG|ENV)[[:space:]].*(TOKEN|PASSWORD|SECRET|API_KEY)' Dockerfile.private; then
            echo "::error::Potential credential in Dockerfile build arguments or environment."
            exit 1
          fi

          grep -q -- '--mount=type=secret,id=nuget_config,required=true' Dockerfile.private
          grep -q -- 'UsePrivateFrameworkPackage=true' Dockerfile.private
          echo 'Private NuGet build prerequisites validated.'

  verify-private-package-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Create temporary authenticated NuGet configuration
        env:
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/NuGet.Private.Config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="github-private" value="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <github-private>
                <add key="Username" value="${{ github.actor }}" />
                <add key="ClearTextPassword" value="$NUGET_TOKEN" />
              </github-private>
            </packageSourceCredentials>
          </configuration>
          EOF
      - name: Build and publish without Framework source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-consumer"
          tar --exclude=.git --exclude=artifacts -cf - . | tar -xf - -C "$RUNNER_TEMP/private-consumer"
          rm -rf "$RUNNER_TEMP/private-consumer/DentalDashboard.Framwork"
          dotnet restore "$RUNNER_TEMP/private-consumer/DentalDashboard/DentalDashboard.csproj" \
            -p:UsePrivateFrameworkPackage=true \
            -p:FrameworkPackageVersion=1.0.0 \
            --configfile "$RUNNER_TEMP/NuGet.Private.Config"
          dotnet publish "$RUNNER_TEMP/private-consumer/DentalDashboard/DentalDashboard.csproj" \
            --configuration Release \
            --output "$RUNNER_TEMP/private-publish" \
            --no-restore \
            -p:UsePrivateFrameworkPackage=true \
            -p:FrameworkPackageVersion=1.0.0 \
            /p:UseAppHost=false
          test -f "$RUNNER_TEMP/private-publish/DentalDashboard.Framwork.dll"
          if find "$RUNNER_TEMP/private-publish" -type f -name '*.cs' | grep -q .; then
            echo 'Unexpected C# source in publish output'
            exit 1
          fi
      - name: Build Dockerfile.private with authenticated package feed
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-docker"
          tar --exclude=.git --exclude=artifacts -cf - . | tar -xf - -C "$RUNNER_TEMP/private-docker"
          rm -rf "$RUNNER_TEMP/private-docker/DentalDashboard.Framwork"
          DOCKER_BUILDKIT=1 docker build \
            --secret id=nuget_config,src="$RUNNER_TEMP/NuGet.Private.Config" \
            --file "$RUNNER_TEMP/private-docker/Dockerfile.private" \
            --tag dental-back:private-package-test \
            "$RUNNER_TEMP/private-docker"
