name: Regenerate patient finance EF snapshot
on:
  push:
    branches:
      - feature/patient-installment-ledger-and-unique-documents
    paths:
      - .github/workflows/regenerate-patient-finance-snapshot.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/patient-installment-ledger-and-unique-documents
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install matching EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.8
      - name: Restore
        run: dotnet restore DentalDashboard/DentalDashboard.csproj
      - name: Regenerate snapshot using actual EF Core model
        shell: bash
        run: |
          set -euo pipefail
          dotnet ef migrations add TemporarySnapshotRegeneration \
            --project DentalDashboard.Infrastracture/DentalDashboard.Infrastracture.csproj \
            --startup-project DentalDashboard/DentalDashboard.csproj \
            --context DentalContext \
            --output-dir Migrations
          rm DentalDashboard.Infrastracture/Migrations/*_TemporarySnapshotRegeneration.cs
          rm DentalDashboard.Infrastracture/Migrations/*_TemporarySnapshotRegeneration.Designer.cs
          git diff --check
          dotnet build DentalDashboard/DentalDashboard.csproj --no-restore
          dotnet ef migrations has-pending-model-changes \
            --project DentalDashboard.Infrastracture/DentalDashboard.Infrastracture.csproj \
            --startup-project DentalDashboard/DentalDashboard.csproj \
            --context DentalContext
      - name: Commit only generated model snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DentalDashboard.Infrastracture/Migrations/DentalContextModelSnapshot.cs
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate patient finance snapshot using EF Core 10 tooling"
            git push origin HEAD:feature/patient-installment-ledger-and-unique-documents
          fi
